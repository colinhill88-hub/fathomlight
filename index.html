<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the game fill the whole iPhone screen, including around the camera notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Fathomlight</title>
    <meta name="theme-color" content="#0b2a33" />
    <!-- These let the game be added to the iPhone home screen and open full screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fathomlight" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game"></div>
    <div id="vignette"></div>
    <div id="low-o2"></div>

    <div id="watch-wrap">
      <canvas id="watch" aria-label="Dive watch: oxygen, depth and dive time"></canvas>
      <div id="inventory" aria-label="Carried materials"></div>
    </div>

    <div id="toasts" aria-live="polite"></div>
    <div id="banner"></div>
    <div id="bag-marker"><div class="arrow"></div><span>Bag</span><span id="bag-dist"></span></div>

    <div id="controls">
      <div id="stick-base"></div>
      <div id="stick-knob"></div>
      <button id="btn-lamp" type="button" aria-label="Lamp">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path fill="currentColor" d="M9 21h6v-1.5H9zm3-19a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z" />
        </svg>
      </button>
      <button id="btn-scan" type="button" aria-label="Scan (hold)">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" />
          <circle cx="12" cy="12" r="3.2" fill="currentColor" />
        </svg>
      </button>
      <div id="scan-label"></div>
      <button id="btn-boost" type="button" aria-label="Boost">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path fill="currentColor" d="M4 6l8 6-8 6zm8 0l8 6-8 6z" />
        </svg>
      </button>
    </div>

    <div id="hint">
      <span class="touch-only">Drag on the left to swim · hold Scan near new things · breathe at the surface</span>
      <span class="desk-only">WASD or arrows to swim · Shift boost · L lamp · hold E to scan · breathe at the surface</span>
    </div>

    <div id="hud">
      <div class="hud-buttons">
      <button id="log-btn" type="button" aria-label="Scanner log" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M5 3h11a3 3 0 0 1 3 3v15H7a2 2 0 0 1-2-2zm2 14v2h10v-2zm2-11v2h7V6zm0 4v2h5v-2z" />
        </svg>
      </button>
      <button id="settings-btn" type="button" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
          />
        </svg>
      </button>
      </div>

      <div id="log-panel" class="panel" hidden></div>

      <div id="settings-panel" class="panel" hidden>
        <h2>Graphics</h2>
        <div class="preset-row" role="radiogroup" aria-label="Graphics preset">
          <button type="button" data-preset="auto" role="radio">Auto</button>
          <button type="button" data-preset="high" role="radio">High</button>
          <button type="button" data-preset="ultra" role="radio">Ultra</button>
        </div>
        <dl id="stats">
          <dt>Preset</dt><dd id="stat-preset">-</dd>
          <dt>Frame rate</dt><dd id="stat-fps">-</dd>
          <dt>Resolution</dt><dd id="stat-res">-</dd>
          <dt>Renderer</dt><dd id="stat-renderer">-</dd>
          <dt>Build</dt><dd id="stat-build">-</dd>
        </dl>
        <h2 class="gap">Progress</h2>
        <dl id="save-stats">
          <dt>Saved on this device</dt><dd id="stat-saved">-</dd>
        </dl>
        <button id="reset-btn" type="button">Start over</button>
      </div>
    </div>

    <div id="rotate-hint">
      <div>
        <svg viewBox="0 0 48 48" width="56" height="56" aria-hidden="true">
          <rect x="14" y="6" width="20" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="2.5" />
          <path d="M8 30a16 16 0 0 0 10 12M40 18A16 16 0 0 0 30 6" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
        <p>Turn your phone sideways</p>
      </div>
    </div>

    <div id="blackout"><p id="blackout-text"></p></div>

    <div id="boot-error" hidden></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
